<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BI|idle</title>
</head>
<body>
<script>
// Builds Improved relay page.
// The mod opens this page in the game's hidden web view with ?q=<command JSON>.
// The page does the API work and answers by changing document.title in chunks:
// "BI|<req>|<index>|<count>|<chunk>".
"use strict";

var API = "https://api.deadlock-api.com";
var CHUNK = 4000;            // the web view passes at most 4096 characters per title, prefix included
var GAP_MS = 10;             // pause between title changes
var FETCH_TIMEOUT_MS = 8000;
var CACHE_S = 600;           // answers are reused for 10 minutes (the page reloads per request)
var LB_REGIONS = ["Europe", "NAmerica", "SAmerica", "Asia", "Oceania"];
var LB_SHORT = { Europe: "EU", NAmerica: "NA", SAmerica: "SA", Asia: "ASIA", Oceania: "OCE" };
var TOP_OVERALL = 50;        // top N of each regional leaderboard count as pros
var TOP_HERO = 10;           // top N of each hero leaderboard count as that hero's specialists
var TOP_BUILDS = 12;         // builds listed per section
var USED_DAYS = 21;          // "used by pros" looks at ranked matches this recent
var POPULAR_DAYS = 14;       // "popular in Eternus" looks at ranked matches this recent

// ---------- helpers ----------

function getJson(path) {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS) : null;
    return fetch(API + path, ctrl ? { signal: ctrl.signal } : undefined).then(function (r) {
        if (timer) clearTimeout(timer);
        if (!r.ok) throw new Error(path.split("?")[0] + " -> HTTP " + r.status);
        return r.json();
    }, function (e) {
        if (timer) clearTimeout(timer);
        throw new Error(path.split("?")[0] + " -> " + (e.name === "AbortError" ? "timed out" : e.message));
    });
}

// Runs fn over items with at most `limit` in flight; failed items become null.
function pool(items, limit, fn) {
    var out = new Array(items.length), next = 0;
    function worker() {
        if (next >= items.length) return Promise.resolve();
        var i = next++;
        return fn(items[i]).then(function (v) { out[i] = v; }, function () { out[i] = null; }).then(worker);
    }
    var workers = [];
    for (var w = 0; w < Math.min(limit, items.length); w++) workers.push(worker());
    return Promise.all(workers).then(function () { return out; });
}

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
function load(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }

// Reuses a fresh cached answer, otherwise runs make() and caches its result.
function cached(key, make) {
    var hit = load("bi_cache_" + key);
    if (hit && Date.now() / 1000 - hit.at < CACHE_S) return Promise.resolve(hit.data);
    return make().then(function (data) { store("bi_cache_" + key, { at: Math.floor(Date.now() / 1000), data: data }); return data; });
}

function slimBuild(b) {
    var hb = b.hero_build;
    return {
        id: hb.hero_build_id, h: hb.hero_id, n: hb.name, v: hb.version, a: hb.author_account_id,
        u: hb.last_updated_timestamp || hb.publish_timestamp || 0, f: b.num_favorites || 0
    };
}

// Steam name, avatar and rank badge for each account, in two batch calls.
function profiles(ids) {
    var out = {};
    ids.forEach(function (id) { out[id] = { name: null, avatar: null, badge: 0 }; });
    if (!ids.length) return Promise.resolve(out);
    var q = ids.join(",");
    return Promise.all([
        getJson("/v1/players/steam?account_ids=" + q).catch(function () { return []; }),
        getJson("/v1/players/rank?account_ids=" + q).catch(function () { return []; })
    ]).then(function (res) {
        res[0].forEach(function (p) { if (out[p.account_id]) { out[p.account_id].name = p.personaname; out[p.account_id].avatar = p.avatarmedium; } });
        res[1].forEach(function (r) { if (out[r.account_id]) out[r.account_id].badge = r.badge || 0; });
        return out;
    });
}

// ---------- commands ----------

var commands = {
    // Every playable hero: id, class name (for in-game localisation) and English name.
    heroes: function () {
        return cached("heroes", function () {
            return getJson("/v1/assets/heroes").then(function (list) {
                return list.filter(function (h) { return h.player_selectable !== false; })
                           .map(function (h) { return { id: h.id, cls: h.class_name, name: h.name }; });
            });
        });
    },

    // Everything PROS shows for one hero, in one answer:
    //   used:        builds the tracked pros actually picked in ranked matches (last USED_DAYS)
    //   popular:     builds most used in Eternus-average ranked lobbies (last POPULAR_DAYS)
    //   specialists: the hero's top players per region and their own published builds
    // Tracked pros = top TOP_OVERALL of each regional leaderboard + top TOP_HERO of each hero leaderboard.
    hero: function (q) {
        var hero = Number(q.hero);
        if (!hero) return Promise.reject(new Error("no hero"));
        return cached("hero_" + hero, function () {
            var now = Math.floor(Date.now() / 1000);
            var boards = LB_REGIONS.map(function (r) { return "/v1/leaderboard/" + r; })
                .concat(LB_REGIONS.map(function (r) { return "/v1/leaderboard/" + r + "/" + hero; }));
            return Promise.all(boards.map(function (path) {
                return getJson(path).catch(function () { return { entries: [] }; });
            })).then(function (res) {
                // accountId -> { region, name, place (overall), heroPlace }. Ambiguous names are skipped.
                var lb = {};
                function take(board, regionIndex, top, key) {
                    (board.entries || []).slice(0, top).forEach(function (e) {
                        var ids = e.possible_account_ids || [];
                        if (ids.length !== 1) return;
                        var x = lb[ids[0]] || (lb[ids[0]] = { region: LB_SHORT[LB_REGIONS[regionIndex]], name: e.account_name });
                        x[key] = e.rank;
                    });
                }
                res.slice(0, 5).forEach(function (b, i) { take(b, i, TOP_OVERALL, "place"); });
                res.slice(5).forEach(function (b, i) { take(b, i, TOP_HERO, "heroPlace"); });
                var pros = Object.keys(lb).map(Number);
                var specialists = pros.filter(function (id) { return lb[id].heroPlace; })
                                      .sort(function (a, b) { return lb[a].heroPlace - lb[b].heroPlace; });
                var stats = "/v1/analytics/hero-build-stats?hero_ids=" + hero + "&match_mode=ranked";

                return Promise.all([
                    pros.length ? getJson(stats + "&account_ids=" + pros.join(",") + "&min_unix_timestamp=" + (now - USED_DAYS * 86400)).catch(function () { return []; }) : [],
                    getJson(stats + "&min_average_badge=111&min_matches=5&min_unix_timestamp=" + (now - POPULAR_DAYS * 86400)).catch(function () { return []; }),
                    pool(specialists, 8, function (id) {
                        return getJson("/v1/builds?author_id=" + id + "&hero_id=" + hero + "&only_latest=true&sort_by=updated_at&limit=3");
                    })
                ]).then(function (r) {
                    function top(list) {
                        return (list || []).filter(function (x) { return x.hero_build_id; })
                            .sort(function (a, b) { return (b.players - a.players) || (b.matches - a.matches); })
                            .slice(0, TOP_BUILDS)
                            .map(function (x) { return { id: x.hero_build_id, players: x.players, matches: x.matches }; });
                    }
                    var used = top(r[0]), popular = top(r[1]);
                    var builds = {};
                    specialists.forEach(function (id, i) { (r[2][i] || []).forEach(function (b) { b = slimBuild(b); builds[b.id] = b; }); });
                    var need = used.concat(popular).map(function (x) { return x.id; }).filter(function (id, i, all) { return !builds[id] && all.indexOf(id) === i; });

                    return pool(need, 8, function (id) {
                        return getJson("/v1/builds?build_id=" + id + "&only_latest=true&limit=1");
                    }).then(function (lists) {
                        lists.forEach(function (l) { if (l && l[0]) { var b = slimBuild(l[0]); builds[b.id] = b; } });
                        var authors = Object.keys(builds).map(function (id) { return builds[id].a; }).concat(specialists)
                            .filter(function (id, i, all) { return all.indexOf(id) === i; });
                        return profiles(authors).then(function (prof) {
                            var people = {};
                            authors.forEach(function (id) {
                                var p = prof[id], l = lb[id] || {};
                                people[id] = { name: p.name || l.name || ("Player " + id), avatar: p.avatar, badge: p.badge,
                                               region: l.region || null, place: l.place || null, heroPlace: l.heroPlace || null };
                            });
                            var known = function (x) { return builds[x.id]; };
                            return {
                                hero: hero, tracked: pros.length, usedDays: USED_DAYS, popularDays: POPULAR_DAYS,
                                used: used.filter(known), popular: popular.filter(known),
                                specialists: specialists.map(function (id) {
                                    return { id: id, builds: Object.keys(builds).map(function (k) { return builds[k]; })
                                                                .filter(function (b) { return b.a === id && b.h === hero; })
                                                                .sort(function (a, b) { return b.u - a.u; }) };
                                }),
                                builds: builds, people: people
                            };
                        });
                    });
                });
            });
        });
    },

    // Latest builds for this hero from the players the user follows.
    following: function (q) {
        var ids = (q.ids || []).map(Number).filter(Boolean).slice(0, 40), hero = Number(q.hero);
        return cached("follow_" + hero + "_" + ids.slice().sort().join(","), function () {
            return Promise.all([
                pool(ids, 8, function (id) {
                    return getJson("/v1/builds?author_id=" + id + "&hero_id=" + hero + "&only_latest=true&sort_by=updated_at&limit=5");
                }),
                profiles(ids)
            ]).then(function (res) {
                var builds = [];
                res[0].forEach(function (l) { (l || []).forEach(function (b) { builds.push(slimBuild(b)); }); });
                builds.sort(function (x, y) { return y.u - x.u; });
                return { players: res[1], builds: builds.slice(0, 80) };
            });
        });
    },

    // Find players by Steam name, to follow them (not cached: the user is typing).
    search: function (q) {
        return getJson("/v1/players/steam-search?search_query=" + encodeURIComponent(q.text || "")).then(function (list) {
            return (list || []).slice(0, 10).map(function (p) { return { id: p.account_id, name: p.personaname, avatar: p.avatarmedium }; });
        });
    },

    // The follow list lives in this page's localStorage, so it survives game restarts.
    follows_get: function () { return Promise.resolve(load("bi_follows") || []); },
    follows_set: function (q) {
        var ids = (q.ids || []).map(Number).filter(Boolean).slice(0, 40);
        store("bi_follows", ids);
        return Promise.resolve(ids);
    }
};

// ---------- answering ----------

function send(req, payload) {
    var text = JSON.stringify(payload);
    var count = Math.max(1, Math.ceil(text.length / CHUNK)), i = 0;
    (function next() {
        if (i >= count) return;
        document.title = "BI|" + req + "|" + i + "|" + count + "|" + text.slice(i * CHUNK, (i + 1) * CHUNK);
        i++;
        setTimeout(next, GAP_MS);
    })();
}

(function main() {
    var raw = new URLSearchParams(location.search).get("q");
    if (!raw) return;
    var q;
    try { q = JSON.parse(raw); } catch (e) { send(0, { ok: false, error: "bad request" }); return; }
    var fn = commands[q.cmd];
    if (!fn) { send(q.req, { ok: false, error: "unknown command " + q.cmd }); return; }
    fn(q).then(
        function (data) { send(q.req, { ok: true, data: data }); },
        function (err) { send(q.req, { ok: false, error: String(err && err.message || err) }); });
})();
</script>
</body>
</html>
