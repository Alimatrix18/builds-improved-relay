<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BI|idle</title>
</head>
<body>
<script src="core.js"></script>
<script>
// Builds Improved relay page.
// The mod opens this page in the game's hidden web view with ?q=<command JSON>.
// The page answers by changing document.title in chunks: "BI|<req>|<index>|<count>|<chunk>".
// Hero data comes from the daily prebuilt files in data/ (see build_data.js); only if a file is
// missing is a per-group answer built live from deadlock-api.com (core.js).
"use strict";

var CHUNK = 4000;            // the web view passes at most 4096 characters per title, prefix included
var GAP_MS = 10;             // pause between title changes
var CACHE_S = 600;           // live answers are reused for 10 minutes (the page reloads per request)
// Data files are rebuilt daily; any age is used (the mod shows how old it is). Only when there is
// no file at all does the page build a (much thinner) answer live.
var core = window.BI_CORE;

var HERO_CACHE_MAX = 8;       // hero answers kept in this page's storage (each can be a few hundred KB)
var HERO_PREFIX = "bi_cache_hero3_";

// Cached hero answers, oldest first: [{ key, at }]. Their times are kept in a small index, so
// finding the oldest doesn't parse every (large) cached answer.
var INDEX_KEY = "bi_cache_index";
function heroIndex() { try { return JSON.parse(localStorage.getItem(INDEX_KEY) || "{}") || {}; } catch (e) { return {}; } }
function saveIndex(idx) { try { localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); } catch (e) {} }
function heroEntries() {
    var idx = heroIndex(), out = [];
    try {
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(HERO_PREFIX) === 0) out.push({ key: k, at: idx[k] || 0 });
        }
    } catch (e) {}
    return out.sort(function (x, y) { return x.at - y.at; });
}
function dropHero(key) {
    try { localStorage.removeItem(key); } catch (e) { return false; }
    var idx = heroIndex(); delete idx[key]; saveIndex(idx);
    return true;
}

// Writes to this page's storage. When it is full, cached hero answers (re-fetchable) make room,
// oldest first, so saved builds are never lost to them. Returns whether the write succeeded.
function store(key, value) {
    var text = JSON.stringify(value);
    for (;;) {
        try { localStorage.setItem(key, text); break; }
        catch (e) {
            var old = heroEntries().filter(function (x) { return x.key !== key; });
            if (!old.length || !dropHero(old[0].key)) return false;
        }
    }
    if (key.indexOf(HERO_PREFIX) === 0) {
        var idx = heroIndex(); idx[key] = (value && value.at) || nowS(); saveIndex(idx);
        var all = heroEntries();
        for (var n = 0; n < all.length - HERO_CACHE_MAX; n++) dropHero(all[n].key);
    }
    return true;
}
function load(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function nowS() { return Math.floor(Date.now() / 1000); }

// Reuses a cached answer younger than maxAge, otherwise runs make() and caches its result.
function cached(key, maxAge, make) {
    var hit = load("bi_cache_" + key);
    if (hit && nowS() - hit.at < maxAge) return Promise.resolve(hit.data);
    return make().then(function (data) { store("bi_cache_" + key, { at: nowS(), data: data }); return data; });
}

// A prebuilt file next to this page, or null when it is missing or older than maxAge.
function prebuilt(name, maxAge) {
    return fetch("data/" + name + ".json", { cache: "no-store" }).then(function (r) {
        return r.ok ? r.json() : null;
    }).then(function (d) {
        if (!d) return null;
        var at = d.generatedAt || (d.meta && d.meta.generatedAt) || 0;
        return maxAge && nowS() - at > maxAge ? null : d;
    }).catch(function () { return null; });
}

function prebuiltOr(name, maxAge, live) {
    return prebuilt(name, maxAge).then(function (d) { return d ? (d.data !== undefined ? d.data : d) : live(); });
}

var commands = {
    heroes: function () {
        return cached("heroes", 86400, function () { return prebuiltOr("heroes", 0, core.heroes); });
    },
    items: function () {
        return cached("items", 86400, function () { return prebuiltOr("items", 0, core.items); });
    },
    // stale: answer from this page's cache whatever its age (the mod shows it at once and asks
    //        again with fresh when it is old); fresh: ignore the cache. cachedAt tells the age.
    hero: function (q) {
        var id = Number(q.hero);
        if (!id) return Promise.reject(new Error("no hero"));
        var hit = load("bi_cache_hero3_" + id);
        if (q.stale && hit) { hit.data.cachedAt = hit.at; return Promise.resolve(hit.data); }
        return cached("hero3_" + id, q.fresh ? 0 : CACHE_S, function () {
            return prebuilt("hero_" + id, 0).then(function (d) { return d && d.v === 3 ? d : core.hero(id); });
        }).then(function (d) {
            var c = load("bi_cache_hero3_" + id);
            d.cachedAt = c ? c.at : nowS();
            return d;
        });
    },
    // builds starred in PROS (whole builds, so they show even when no pro plays them any more),
    // kept in this page's storage so they survive restarts; newest first, at most 200
    saved_get: function () { return Promise.resolve(load("bi_saved") || []); },
    saved_add: function (q) {
        var b = q.build;
        if (!b || !b.id) return Promise.reject(new Error("no build"));
        var list = (load("bi_saved") || []).filter(function (x) { return x.id !== b.id; });
        list.unshift(b);
        return store("bi_saved", list.slice(0, 200)) ? Promise.resolve(true) : Promise.reject(new Error("storage full"));
    },
    saved_remove: function (q) {
        store("bi_saved", (load("bi_saved") || []).filter(function (x) { return x.id !== Number(q.id); }));
        return Promise.resolve(true);
    }
};

function send(req, payload) {
    var text = JSON.stringify(payload);
    var count = Math.max(1, Math.ceil(text.length / CHUNK)), i = 0;
    (function next() {
        if (i >= count) return;
        document.title = "BI|" + req + "|" + i + "|" + count + "|" + text.slice(i * CHUNK, (i + 1) * CHUNK);
        i++;
        setTimeout(next, GAP_MS);
    })();
}

(function main() {
    var raw = new URLSearchParams(location.search).get("q");
    if (!raw) return;
    var q;
    try { q = JSON.parse(raw); } catch (e) { send(0, { ok: false, error: "bad request" }); return; }
    if (!core) { send(q.req, { ok: false, error: "core.js missing on the relay site" }); return; }
    var fn = commands[q.cmd];
    if (!fn) { send(q.req, { ok: false, error: "unknown command " + q.cmd }); return; }
    fn(q).then(
        function (data) { send(q.req, { ok: true, data: data }); },
        function (err) { send(q.req, { ok: false, error: String(err && err.message || err) }); });
})();
</script>
</body>
</html>
