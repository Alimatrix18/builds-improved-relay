# Rebuilds the relay site once a day: index.html + core.js + fresh data/ files.
# After a big Deadlock patch, run it by hand (Actions > Build data > Run workflow).
# Needs Settings > Pages > Source = "GitHub Actions".
name: Build data

on:
  schedule:
    - cron: "17 3 * * *"      # daily at 03:17 UTC (07:17 in Mauritius), off the busy :00 mark
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB (reads deadlock-api's data lake)
        run: pip install duckdb
      # builds are fetched one by one, so keep them between runs
      - uses: actions/cache@v4
        with:
          path: cache
          key: bi-cache-${{ github.run_id }}
          restore-keys: bi-cache-
      - name: Build data files
        run: node build_data.js _site cache
      - name: Add the relay page
        run: cp index.html core.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
